name: CI & Automated Dockhand Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Run Unit Tests & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            services/backend/package-lock.json
            services/frontend/package-lock.json

      - name: Install & Test Backend
        run: |
          cd services/backend
          npm ci
          npx prisma generate
          npm run build
          npm run test

      - name: Install & Build Frontend
        run: |
          cd services/frontend
          npm ci
          npm run build

  trigger-dockhand:
    name: Trigger Remote Dockhand Webhook
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Call Dockhand Webhook (si está configurado en GitHub Secrets)
        env:
          DOCKHAND_WEBHOOK_URL: ${{ secrets.DOCKHAND_WEBHOOK_URL }}
        run: |
          if [ -n "$DOCKHAND_WEBHOOK_URL" ]; then
            echo "🚀 Disparando actualización automática en Dockhand..."
            curl -X POST -f -s -o /dev/null "$DOCKHAND_WEBHOOK_URL" || echo "⚠️ Falló la llamada al Webhook de Dockhand."
          else
            echo "ℹ️ DOCKHAND_WEBHOOK_URL no configurado en los Secretos del repositorio. Saltando webhook."
          fi
